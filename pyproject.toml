[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophix-theme-bundle"
version = "2026.10.11.01"
description = "A bundle of demonstration color-palette themes for Ophix Project Servers"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Ophix Project" }
]
dependencies = [
    "ophix-admin-interface>=2026.09.07.01",
]

[project.entry-points."ophix.plugins"]
ophix_theme_bundle = "ophix_theme_bundle"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ophix_theme_bundle = [
    "OPHIX_RELEASE_NOTES.md",
    "themes/**/*",
    "deploy_templates/**/*",
]
